name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    name: Lint & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v14
        continue-on-error: true
        with:
          name: org-agenda-api
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run nix flake check (elisp compile, ruff)
        run: nix flake check "path:$GITHUB_WORKSPACE" --print-build-logs

  test:
    name: Integration Tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v14
        continue-on-error: true
        with:
          name: org-agenda-api
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run integration tests
        run: nix develop "path:$GITHUB_WORKSPACE" -c pytest tests/ --ignore=tests/test_container_integration.py -v -s --tb=short --timeout=60

  container:
    name: Container Build & Test
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v14
        continue-on-error: true
        with:
          name: org-agenda-api
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build base container
        run: nix build "path:$GITHUB_WORKSPACE#container-base" -o result-base

      - name: Build container
        run: nix build "path:$GITHUB_WORKSPACE#container" -o result

      - name: Run container integration tests
        run: nix develop "path:$GITHUB_WORKSPACE" -c pytest tests/test_container_integration.py -v -s
